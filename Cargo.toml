[package]
name = "eh3d-design-explorer"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Comparison of design alternatives across several criteria without hiding any behind a single score: the non-dominated set, the difference between two alternatives and a deterministic parametric sweep"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-DESIGN-EXPLORER"
readme = "README.md"

[lib]
name = "eh3d_design_explorer"
path = "src/lib.rs"

[[bin]]
name = "eh3d-design-explorer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
